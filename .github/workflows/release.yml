name: Release Personal Build

on:
  push:
    tags:
      - "v*-hariketsu.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Ice.xcodeproj \
            -scheme Ice \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/IceDerivedData" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Ad-hoc sign app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/IceDerivedData/Build/Products/Release/Ice.app"
          codesign \
            --force \
            --deep \
            --sign - \
            --entitlements Ice/Ice.entitlements \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package release
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/IceDerivedData/Build/Products/Release/Ice.app"
          mkdir -p "$RUNNER_TEMP/release"
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "$RUNNER_TEMP/release/Ice.zip"
          cd "$RUNNER_TEMP/release"
          shasum -a 256 Ice.zip > Ice.zip.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/Ice.zip" \
            "$RUNNER_TEMP/release/Ice.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ice $GITHUB_REF_NAME" \
            --generate-notes
